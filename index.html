<style>
[hidden]{display:none!important}
:root{--navy:#0F3D7A;--blue:#1A3E8C;--gold:#F2B632;--gold-d:#7A5B12;--ink:#0B2447;--muted:#5B6B85;--bg:#F7F5EE;--card:#fff;--line:#E6E2D3;--r:18px;
  --head:'Unbounded','Trebuchet MS',system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--body);overflow-x:clip;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.emb{display:block}

/* sarlavha */
header.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap;padding:4px 0}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand b{font:700 15px/1 var(--head);color:var(--blue);letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:700 9.5px/1 var(--body);letter-spacing:.18em;color:var(--gold-d);margin-top:5px}
nav.m{display:flex;gap:2px}
nav.m a{white-space:nowrap;text-decoration:none;font-weight:700;font-size:14px;color:var(--muted);padding:9px 10px;border-radius:10px;transition:background-color .15s,color .15s}
nav.m a:hover{background:#EEF2FA;color:var(--navy)}
a.staff{border:1.5px solid var(--navy);color:var(--navy)!important;margin-left:6px;background:#fff}
a.staff:hover{background:var(--navy)!important;color:#fff!important}
nav.m a[aria-current=page]{color:var(--navy);background:#EEF2FA;box-shadow:inset 0 -3px 0 var(--gold)}

/* hero */
.hero{background:radial-gradient(900px 420px at 85% 30%,#1c5aa8 0,transparent 60%),linear-gradient(135deg,#0B2F63,#0F3D7A 55%,#1A3E8C);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--gold)}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding:56px 18px 62px}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.22em;color:var(--gold)}
.hero h1{font:700 clamp(28px,5.2vw,52px)/1.08 var(--head);margin:14px 0 14px;letter-spacing:-.01em}
.hero p{margin:0 0 24px;max-width:540px;color:#D6E2F5;font-size:17px}
.hero .emb-box{justify-self:center;background:#fff;border-radius:50%;width:min(300px,70vw);aspect-ratio:1;display:grid;place-items:center;box-shadow:0 0 0 7px var(--gold),0 24px 60px rgba(0,0,0,.4)}
.hero .emb-box svg{width:74%;height:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:700 15px/1 var(--body);padding:14px 22px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .15s,background-color .15s}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 6px 18px rgba(242,182,50,.35)}
.btn.gold:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(242,182,50,.45)}
.btn.line{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn.line:hover{background:rgba(255,255,255,.12)}
.btn.navy{background:var(--navy);color:#fff}
.btn.navy:hover{background:var(--blue)}
.btn.out{border-color:var(--line);color:var(--navy);background:#fff}
.btn.out:hover{border-color:var(--navy)}

/* bo'limlar */
section.blk{padding:44px 0 8px}
.hd{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.hd h2{font:700 clamp(20px,3.4vw,28px)/1.15 var(--head);margin:0;color:var(--navy)}
.hd h2::after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--gold);margin-top:10px}
.hd a{font-weight:800;color:var(--navy);text-decoration:none;white-space:nowrap}
.hd a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,61,122,.14);border-color:#c9d5ea}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#E9EFFA,#F7ECCB);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:46px;height:auto;opacity:.55}
.cb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.chip{font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:99px;background:#EEF2FA;color:var(--navy)}
.chip.yutuq{background:#FCEFC9;color:var(--gold-d)}
.chip.elon{background:#FDE4E1;color:#a1301f}
.chip.pin{background:var(--gold);color:#3b2a00}
.card h3{font:700 17px/1.3 var(--head);margin:0;color:var(--ink)}
.card p{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.alert{display:flex;gap:14px;align-items:center;background:#FFF6DC;border:1px solid #F0D58A;border-left:6px solid var(--gold);border-radius:14px;padding:14px 18px;margin-top:-26px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(15,61,122,.1);text-decoration:none}
.alert b{font:700 15px/1.3 var(--head);color:var(--navy)}
.alert span{color:var(--gold-d);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filters button{border:1.5px solid var(--line);background:#fff;color:var(--muted);font:700 14px/1 var(--body);padding:10px 15px;border-radius:99px;cursor:pointer;transition:all .15s}
.filters button:hover{border-color:var(--navy);color:var(--navy)}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* maqola */
.art{max-width:760px;margin:0 auto;padding-top:28px}
.back{display:inline-flex;gap:6px;text-decoration:none;font-weight:800;color:var(--navy);margin-bottom:16px}
.art h1{font:700 clamp(24px,4.4vw,38px)/1.18 var(--head);margin:12px 0 18px;color:var(--navy)}
.art .cover{border-radius:var(--r);overflow:hidden;margin:0 0 24px;border:1px solid var(--line);background:#fff}
.art .cover img{width:100%;max-height:480px;object-fit:cover}
.body{font-size:17.5px;line-height:1.75}
.body p{margin:0 0 1.1em}
.body a{color:var(--blue);font-weight:700;word-break:break-word}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 8px;padding-top:22px;border-top:1px solid var(--line)}

/* aloqa */
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.irow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.irow i{font-style:normal;width:42px;height:42px;border-radius:12px;background:#EEF2FA;display:grid;place-items:center;font-size:20px;flex:none}
.irow small{display:block;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.irow a{color:var(--navy);font-weight:800;text-decoration:none;word-break:break-word}

/* holatlar */
.skel{border-radius:var(--r);background:linear-gradient(90deg,#ece8da 25%,#f6f3ea 50%,#ece8da 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;height:300px}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:46px 18px;color:var(--muted)}
.state svg{width:96px;height:auto;margin:0 auto 12px;opacity:.9}
.state b{display:block;font:700 18px/1.3 var(--head);color:var(--navy);margin-bottom:6px}

#tip{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:14.5px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#tip button{float:right;margin-left:10px;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer}
.linkbtn{border:0;background:none;color:#fff;font:700 14px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.gmsg{margin-top:10px;font-weight:700}
.cover img,.gal img{cursor:zoom-in}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line);transition:transform .15s}
.gal img:hover{transform:scale(1.02)}
.vid{margin:24px 0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000}
.vid iframe{display:block;width:100%;border:0;aspect-ratio:16/9}
.vid.tg{background:#fff}.vid.tg iframe{aspect-ratio:auto;height:560px}
.ph{position:relative}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(11,36,71,.82);color:#fff;font:700 12px/1 var(--body);padding:6px 9px;border-radius:99px}
.cnt.v{right:auto;left:10px;background:var(--gold);color:#3b2a00}
#lb{display:none;position:fixed;inset:0;z-index:90;background:rgba(5,15,35,.94);align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lbx,.lbn{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:48px;height:48px;font-size:28px;cursor:pointer;display:grid;place-items:center}
.lbx{top:14px;right:14px}.lbn.p{left:12px;top:50%}.lbn.n{right:12px;top:50%}
#lb.one .lbn{display:none}
.lbc{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:99px}
@media (max-width:560px){.gal{grid-template-columns:repeat(2,1fr)}.vid.tg iframe{height:480px}}
.nsq{width:100%;max-width:420px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:500 15px var(--body);color:var(--ink);margin:0 0 14px}
.nsq:focus{outline:none;border-color:var(--navy)}
.morebtn{text-align:center;margin:22px 0 4px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 14px;text-align:center}
.pc .av{width:112px;height:112px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:linear-gradient(135deg,#E9EFFA,#F7ECCB);display:grid;place-items:center;font:700 34px var(--head);color:var(--navy);border:3px solid var(--gold)}
.pc .av img{width:100%;height:100%;object-fit:cover}
.pc b{font:700 15.5px/1.3 var(--head);display:block}
.pc span{color:var(--muted);font-weight:600;font-size:14px}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.ac{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;align-items:flex-start}
.ac .pic{width:96px;height:96px;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(135deg,#E9EFFA,#F7ECCB);display:grid;place-items:center;font-size:34px}
.ac .pic img{width:100%;height:100%;object-fit:cover}
.ac h3{font:700 16px/1.3 var(--head);margin:0 0 6px}.ac p{margin:0;color:var(--muted);font-size:15px}
.evl{display:grid;gap:12px}
.ev{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;align-items:center}
.ev .dt{width:66px;flex:none;text-align:center;background:var(--navy);color:#fff;border-radius:14px;padding:9px 4px}
.ev .dt b{display:block;font:700 24px/1 var(--head)}
.ev .dt small{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.ev h3{font:700 16px/1.3 var(--head);margin:0 0 4px}.ev p{margin:0;color:var(--muted);font-size:14.5px}
.ev.past{opacity:.72}.ev.past .dt{background:#8795ad}
.sub{font:700 14px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
table.tt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.tt th{background:var(--navy);color:#fff;text-align:left;padding:12px 16px;font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase}
table.tt td{padding:12px 16px;border-top:1px solid var(--line)}
table.tt tr.br td{color:var(--muted);background:#faf8f1}
.lks{display:grid;gap:10px}
.lks a{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;font-weight:700;color:var(--navy);transition:border-color .15s}
.lks a:hover{border-color:var(--navy)}
.pg-sub{color:var(--muted);margin:-8px 0 20px}
@media (max-width:860px){.people{grid-template-columns:repeat(2,1fr)}.achs{grid-template-columns:1fr}}
@media (max-width:420px){.pc .av{width:88px;height:88px;font-size:28px}.ev .dt{width:58px}}
.evlink{text-decoration:none;color:inherit;display:block;border-radius:var(--r);transition:transform .15s,box-shadow .15s}
.evlink:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,61,122,.12)}
.evi{width:84px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.evgo{color:var(--blue);font-weight:800;font-size:14px}
.gridwrap{overflow-x:auto}
table.gt{min-width:760px;table-layout:fixed}
table.gt td{vertical-align:top;font-size:14.5px;line-height:1.35}
table.gt td b{display:block}
table.gt td small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
table.gt td.ln{width:92px;background:#faf8f1}
table.gt td.ln small{color:var(--gold-d)}
table.gt .nil{color:#c8c4b4}
table.tt th.td,table.tt td.td{background:#FFF6DC}
table.tt th.td{background:var(--gold);color:#3b2a00}
.dcards{display:none;gap:12px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dcard.td{border-color:var(--gold);background:#FFFBEE}
.dcard h4{margin:0 0 8px;font:700 15px var(--head);color:var(--navy)}
.dcard ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dcard li{display:flex;gap:10px;align-items:flex-start}
.dcard .n{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.dcard li b{display:block;line-height:1.3}.dcard li small{display:block;color:var(--muted);font-size:12.5px}.dcard li em{font-style:normal;color:var(--gold-d);font-size:12px;font-weight:700}
@media (max-width:760px){.gridwrap{display:none}.dcards{display:grid}.evi{width:64px;height:52px}}
.ft{margin-top:60px;background:var(--ink);color:#B8C6E0}
.ft-grid{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:30px;padding:42px 18px 28px}
.ft h4{margin:0 0 12px;color:#fff;font:700 13px var(--body);letter-spacing:.12em;text-transform:uppercase}
.ft-b{display:flex;gap:12px;align-items:center}.ft-b b{display:block;font:700 16px var(--head);color:#fff}
.ft-b small{display:block;color:var(--gold);letter-spacing:.18em;font-weight:700;font-size:10.5px;margin-top:5px}
.ft-p{margin:14px 0 0;font-size:14.5px;max-width:340px;line-height:1.6}
.ft-l{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:15px}
.ft a{color:#DCE6F7;text-decoration:none}.ft a:hover{color:#fff;text-decoration:underline}
.soc{display:flex;gap:10px;margin-top:18px}
.soc-a{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff!important;transition:background-color .15s,transform .15s}
.soc-a:hover{background:var(--gold);color:#3b2a00!important;transform:translateY(-2px);text-decoration:none!important}
.ft-bot{border-top:1px solid rgba(255,255,255,.12);padding:16px 0 20px;font-size:14px}
.ft-bot .wrap{display:flex;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;align-items:center}
.ft-legal{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.legal{max-width:780px}.legal h3{font:700 19px/1.3 var(--head);color:var(--navy);margin:1.6em 0 .5em}.legal p{margin:0 0 1em;font-size:16.5px;line-height:1.75}
.legal .upd{color:var(--muted);font-size:14px}
@media (max-width:760px){.ft-grid{grid-template-columns:1fr;gap:24px;padding:34px 18px 18px}}
.view{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;padding:38px 18px 50px}
  .hero .emb-box{order:-1;width:170px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .info{grid-template-columns:1fr}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .brand small{display:none}
  .brand b{font-size:13px}
  .bar{gap:6px}
  nav.m a{padding:9px 10px;font-size:14px}
  .hd{align-items:flex-start;flex-direction:column}
}
@media (max-width:1200px){nav.m{order:3;width:100%;overflow-x:auto;margin:0 0 6px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}nav.m::-webkit-scrollbar{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

  var FIREBASE_CONFIG={apiKey:"AIzaSyCyY4iguO742_S9Io843WK5GGHZFSYDPOc",authDomain:"maktab-49da5.firebaseapp.com",projectId:"maktab-49da5",storageBucket:"maktab-49da5.firebasestorage.app",messagingSenderId:"437130046048",appId:"1:437130046048:web:27b0a43304507a1bc57105"};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  var galleryImgs=[];

  /* ====== Firestore ====== */

          news=s.docs.map(function(d){var o=d.data(); o.id=d.id; return o}).sort(function(a,b){
            return (b.pinned?1:0)-(a.pinned?1:0)||String(b.date||'').localeCompare(String(a.date||''));
          }); res();
        }).catch(function(e){err=e; res()});
      }catch(e){err=e; res()}
    });
  }
  function errBox(){return empty("Yangiliklarni yuklab bo'lmadi","Internet aloqasini tekshirib, qayta urinib ko'ring.<br><br><button class='btn navy' data-retry>Qayta urinish</button>")}

  /* ====== Sahifalar ====== */
  function home(){
    var pin=news&&news.filter(function(n){return n.pinned})[0], rest=news?news.slice(0,3):[];
    return '<section class="hero"><div class="wrap"><div><div class="eyebrow">TARBIYA · BILIM · KELAJAK</div><h1>28-maktabga<br>xush kelibsiz</h1><p>'+esc(SCHOOL.intro)+'</p><div class="btns"><a class="btn gold" href="#/yangiliklar">Yangiliklar</a><a class="btn line" href="#/aloqa">Aloqa</a><button type="button" class="btn line" data-install hidden data-install-btn>📲 Ilovani o\'rnatish</button></div></div><div class="emb-box"><svg viewBox="0 0 240 240" role="img" aria-label="28-maktab emblemasi"><use href="#emb"/></svg></div></div></section>'+
      '<div class="wrap">'+(pin?'<a class="alert" href="/yangilik/'+esc(pin.id)+'"><div><span>Muhim e\'lon</span><br><b>'+esc(pin.title)+'</b></div></a>':'')+
      '<section class="blk"><div class="hd"><h2>So\'nggi yangiliklar</h2><a href="#/yangiliklar">Hammasi →</a></div>'+
      (news===null?SK:err?errBox():rest.length?'<div class="grid">'+rest.map(card).join('')+'</div>':empty("Hozircha yangilik yo'q","Tez orada maktab yangiliklari shu yerda paydo bo'ladi."))+'</section></div>';
  }
  var qs='', lim=9;
  function filt(){ var q=qs.toLowerCase().trim(); return (news||[]).filter(function(n){ return (!cat||n.cat===cat)&&(!q||(String(n.title)+' '+plain(n.body)).toLowerCase().indexOf(q)>=0) }) }

  }
  function list(){
    var FL=[['','Hammasi'],['yangilik','Yangiliklar'],['tadbir','Tadbirlar'],['yutuq','Yutuqlar'],['elon',"E'lonlar"]];
    var f='<div class="filters" role="group" aria-label="Kategoriya">'+FL.map(function(c){return '<button type="button" data-cat="'+c[0]+'" class="'+(cat===c[0]?'on':'')+'">'+c[1]+'</button>'}).join('')+'</div>';
    return '<div class="wrap"><section class="blk"><div class="hd"><h2>Yangiliklar</h2><a class="btn navy" data-staff hidden href="/platforma#yangiliklar" style="color:#fff">＋ Yangilik qo\'shish</a></div>'+
      '<input type="search" class="nsq" id="nsq" placeholder="Yangiliklardan qidirish..." value="'+esc(qs)+'" aria-label="Qidirish">'+f+
      (news===null?SK:err?errBox():'<div id="ngrid">'+gridInner()+'</div>')+'</section></div>';
  }
  /* ====== Maktab bo'limlari (platformadagi formalardan: publicinfo/<nom>) ====== */
  var SEC={};
  function secLoad(name){
    if(SEC[name]!==undefined) return Promise.resolve();
    return new Promise(function(res){
      try{
        if(!window.firebase||!firebase.firestore) throw new Error('offline');
        if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        firebase.firestore().collection('publicinfo').doc(name).get().then(function(d){ var o=d.exists?d.data():{}; SEC[name]=(name==='bellsets'||name==='lessons')?o:(Array.isArray(o.items)?o.items:[]); res() }).catch(function(){ SEC[name]=false; res() });
      }catch(e){ SEC[name]=false; res() }
    });
  }
  function pageWrap(title,sub,inner){ return '<div class="wrap"><section class="blk"><div class="hd"><h2>'+title+'</h2></div>'+(sub?'<p class="pg-sub">'+sub+'</p>':'')+inner+'</section></div>' }
  function secState(names){ for(var i=0;i<names.length;i++){ if(SEC[names[i]]===undefined) return 'load'; if(SEC[names[i]]===false) return 'err' } return 'ok' }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2) }
  function team(){
    var st=secState(['team']); if(st==='load') return pageWrap('Jamoa','',SK); if(st==='err') return '<div class="wrap">'+errBox()+'</div>';
    var it=SEC.team.filter(function(x){return x&&x.name});
    return pageWrap('Jamoa',"Maktab ma'muriyati va o'qituvchilar",it.length?'<div class="people">'+it.map(function(x){ var im=okImg(x.photo); return '<div class="pc"><div class="av">'+(im?'<img src="'+im+'" alt="'+esc(x.name)+'" loading="lazy">':esc(String(x.name).trim().charAt(0).toUpperCase()))+'</div><b>'+esc(x.name)+'</b><span>'+esc(x.role||'')+'</span></div>' }).join('')+'</div>':empty("Ma'lumot tez orada qo'shiladi",'Jamoa haqida ma\'lumot hozircha kiritilmagan.'));
  }
  function achievements(){
    var st=secState(['achievements']); if(st==='load') return pageWrap('Yutuqlar','',SK); if(st==='err') return '<div class="wrap">'+errBox()+'</div>';
    var it=SEC.achievements.filter(function(x){return x&&x.title}).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});
    return pageWrap('Yutuqlar',"Olimpiadalar, tanlovlar va musobaqalardagi g'alabalar",it.length?'<div class="achs">'+it.map(function(x){ var im=okImg(x.photo); return '<div class="ac"><div class="pic">'+(im?'<img src="'+im+'" alt="" loading="lazy">':'🏆')+'</div><div><h3>'+esc(x.title)+'</h3>'+(x.date?'<div class="meta" style="margin-bottom:6px"><span>'+esc(fdate(x.date))+'</span></div>':'')+(x.text?'<p>'+esc(x.text)+'</p>':'')+'</div></div>' }).join('')+'</div>':empty("Ma'lumot tez orada qo'shiladi",'Yutuqlar hozircha kiritilmagan.'));
  }
  function evRow(x,past){
    var mt=/^(\d{4})-(\d{2})-(\d{2})/.exec(x.date||''); var dt=mt?'<div class="dt"><b>'+(+mt[3])+'</b><small>'+MON[+mt[2]-1].slice(0,3)+'</small></div>':'<div class="dt"><b>—</b></div>';
    var inner='<div class="ev'+(past?' past':'')+'">'+dt+(x.img?'<img class="evi" src="'+x.img+'" alt="" loading="lazy">':'')+'<div><h3>'+esc(x.title)+'</h3><p>'+[x.time?'🕘 '+esc(x.time):'',x.place?'📍 '+esc(x.place):''].filter(Boolean).join(' · ')+'</p>'+(x.note?'<p>'+esc(x.note)+'</p>':'')+(x.href?'<p><b class="evgo">Batafsil o\'qish →</b></p>':'')+'</div></div>';
    return x.href?'<a class="evlink" href="'+esc(x.href)+'">'+inner+'</a>':inner;
  }
  function events(){
    var st=secState(['events']); if(st==='load') return pageWrap('Tadbirlar','',SK); if(st==='err') return '<div class="wrap">'+errBox()+'</div>';
    var t=todayISO(), it=SEC.events.filter(function(x){return x&&x.title}).slice();
    (news||[]).filter(function(n){return n.cat==='tadbir'}).forEach(function(n){ it.push({title:n.title,date:n.date,note:excerpt(n.body),href:'/yangilik/'+n.id,img:imgsOf(n)[0]||''}) });
    var up=it.filter(function(x){return (x.date||'9999')>=t}).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))}), past=it.filter(function(x){return (x.date||'9999')<t}).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))}).slice(0,10);
    return pageWrap('Tadbirlar',"Yaqin kunlardagi tadbirlar, ota-onalar yig'ilishi va bayramlar. «Tadbir» deb belgilangan yangiliklar ham shu yerda ko'rinadi",(up.length?'<div class="evl">'+up.map(function(x){return evRow(x,false)}).join('')+'</div>':empty("Yaqin tadbirlar yo'q","Yangi tadbirlar e'lon qilinganda shu yerda ko'rinadi."))+(past.length?'<div class="sub">O\'tgan tadbirlar</div><div class="evl">'+past.map(function(x){return evRow(x,true)}).join('')+'</div>':''));
  }
  var LDAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'], scCls='', scVar='';
  function inRange(md,f,t){ if(!f||!t) return false; return f<=t?(md>=f&&md<=t):(md>=f||md<=t) }
  function activeVariant(vs,smena){ var md=todayISO().slice(5), c=vs.filter(function(v){return String(v.smena||'1')===String(smena)}); return c.filter(function(v){return inRange(md,v.from,v.to)})[0]||c[0]||null }
  function mdTxt(s){ var x=/^(\d{2})-(\d{2})$/.exec(s||''); return x?(+x[2])+'-'+MON[+x[1]-1]:'' }
  function mins(s){ var x=/^(\d{1,2}):(\d{2})$/.exec(s||''); return x?(+x[1])*60+(+x[2]):null }
  function bellTable(v){
    var rows=(v.rows||[]).filter(function(r){return r&&r.start}), h='<div style="overflow-x:auto"><table class="tt"><thead><tr><th>Dars</th><th>Boshlanishi</th><th>Tugashi</th></tr></thead><tbody>';
    rows.forEach(function(r,i){ h+='<tr><td><b>'+(i+1)+'-dars</b></td><td>'+esc(r.start)+'</td><td>'+esc(r.end||'')+'</td></tr>';
      var nx=rows[i+1]; if(nx){ var d=mins(nx.start)-mins(r.end); if(d>0) h+='<tr class="br"><td>Tanaffus</td><td colspan="2">'+d+' daqiqa</td></tr>' } });
    return h+'</tbody></table></div>';
  }
  function classGrid(cn,c,vs){
    var cells=c.cells||{}, maxL=0, d, l;
    for(d=0;d<6;d++){ var col=cells['d'+d]||{}; Object.keys(col).forEach(function(k){ if(col[k]&&col[k][0]&&+k>maxL) maxL=+k }) }
    if(!maxL) return '<p class="hint">Bu sinf uchun jadval kiritilmagan.</p>';
    var v=activeVariant(vs,c.smena||'1'), rows=v?(v.rows||[]):[], today=(new Date().getDay()+6)%7;
    var tm=function(n){ var r=rows[n-1]; return r&&r.start?esc(r.start)+(r.end?'–'+esc(r.end):''):'' };
    var cell=function(x){ return x&&x[0]?'<b>'+esc(x[0])+'</b>'+((x[1]||x[2])?'<small>'+[x[1]?esc(x[1]):'',x[2]?esc(x[2])+'-xona':''].filter(Boolean).join(' · ')+'</small>':''):'<span class="nil">—</span>' };
    var h='<div class="gridwrap"><table class="tt gt"><thead><tr><th>№</th>'+LDAYS.map(function(n,i){return '<th'+(i===today?' class="td"':'')+'>'+n+'</th>'}).join('')+'</tr></thead><tbody>';
    for(l=1;l<=maxL;l++){ h+='<tr><td class="ln"><b>'+l+'</b><small>'+tm(l)+'</small></td>'; for(d=0;d<6;d++) h+='<td'+(d===today?' class="td"':'')+'>'+cell((cells['d'+d]||{})[l])+'</td>'; h+='</tr>' }
    h+='</tbody></table></div><div class="dcards">';
    for(d=0;d<6;d++){ var col2=cells['d'+d]||{}, any=false, li='';
      for(l=1;l<=maxL;l++){ var x=col2[l]; if(x&&x[0]){ any=true; li+='<li><span class="n">'+l+'</span><div>'+cell(x)+'<em>'+tm(l)+'</em></div></li>' } }
      if(any) h+='<div class="dcard'+(d===today?' td':'')+'"><h4>'+LDAYS[d]+(d===today?' · bugun':'')+'</h4><ul>'+li+'</ul></div>' }
    return h+'</div>'+(v?'<p class="hint">Qo\'ng\'iroq: '+esc(v.name||'')+(v.from&&v.to?' ('+mdTxt(v.from)+' — '+mdTxt(v.to)+')':'')+'</p>':'');
  }
  function schedule(){
    var st=secState(['bellsets','lessons','timetables','bells']); if(st==='load') return pageWrap('Jadval','',SK); if(st==='err') return '<div class="wrap">'+errBox()+'</div>';
    var vs=((SEC.bellsets&&SEC.bellsets.variants)||[]).filter(function(v){return v&&(v.rows||[]).length}), cls=(SEC.lessons&&SEC.lessons.classes)||{}, names=Object.keys(cls).filter(function(k){return cls[k]&&cls[k].cells}).sort(function(a,b){return parseInt(a)-parseInt(b)||a.localeCompare(b)});
    var tl=SEC.timetables.filter(function(x){return x&&x.title&&/^https:\/\//i.test(x.url||'')}), old=SEC.bells.filter(function(x){return x&&x.lesson}), h='';

  var DEF_TERMS="1. Umumiy qoidalar\nUshbu sayt (28maktab.uz) — 28-sonli umumiy o'rta ta'lim maktabining rasmiy axborot sahifasi. Saytdan foydalanish orqali siz quyidagi shartlarga rozilik bildirasiz. Rozi bo'lmasangiz, iltimos, saytdan foydalanmang.\n\n2. Saytning maqsadi\nSayt maktab yangiliklari, e'lonlar, tadbirlar, jadval va aloqa ma'lumotlarini hamma uchun ochiq e'lon qilish uchun mo'ljallangan. Ma'lumotlar axborot maqsadida beriladi. Ularning to'g'riligi va dolzarbligini ta'minlashga harakat qilamiz, lekin xato yoki kechikish bo'lishi mumkin. Rasmiy ma'lumot uchun maktab ma'muriyatiga murojaat qiling.\n\n3. Mualliflik huquqi\nSaytdagi matn, rasm va videolar maktabga yoki ularning mualliflariga tegishli. Ulardan noshirlik va axborot maqsadlarida, manba sifatida 28maktab.uz ga havola qilgan holda foydalanish mumkin. Tijorat maqsadida foydalanish uchun maktabning yozma roziligi kerak.\n\n4. Foydalanuvchi majburiyatlari\nSayt ishiga xalaqit berish, uni buzishga urinish, zararli kod yoki avtomatlashtirilgan hujumlar yuborish, shuningdek saytdan qonunga xilof maqsadlarda foydalanish taqiqlanadi.\n\n5. Rasm va videolar\nO'quvchilarning tasvirlari saytga ota-onalarning (qonuniy vakillarning) roziligi bilan joylanadi. Rasm yoki videoni olib tashlashni xohlasangiz, «Aloqa» bo'limidagi manzillar orqali murojaat qiling. U imkon qadar tezroq olib tashlanadi.\n\n6. Tashqi havolalar va videolar\nSayt uchinchi tomon xizmatlariga (YouTube, Telegram, Instagram va boshqalar) havolalar va ularning videolarini o'z ichiga olishi mumkin. Ularning mazmuni va qoidalari uchun maktab javobgar emas.\n\n7. Javobgarlikni cheklash\nSayt «mavjud holicha» taqdim etiladi. Texnik uzilishlar, ma'lumot yo'qolishi yoki uchinchi tomon xizmatlaridagi nosozliklar tufayli yetkazilgan zarar uchun maktab javobgar bo'lmaydi.\n\n8. Shartlarning o'zgarishi\nShartlar o'zgartirilishi mumkin. Yangi versiya shu sahifada e'lon qilinadi va e'lon qilingan paytdan kuchga kiradi.\n\n9. Aloqa\nSavollar bo'lsa, «Aloqa» bo'limidagi ma'lumotlar orqali murojaat qiling.";
  var DEF_PRIV="1. Qanday ma'lumot to'planadi\nSaytdan foydalanish uchun ro'yxatdan o'tish talab qilinmaydi. Biz sizdan ism, telefon raqami yoki email so'ramaymiz.\n\n2. Texnik ma'lumotlar\nSayt xizmat ko'rsatish jarayonida brauzer va qurilma turi, IP manzil kabi texnik ma'lumotlar hosting (Vercel) va ma'lumotlar bazasi xizmati (Google Firebase) tomonidan avtomatik qayd etilishi mumkin. Ular saytni ishlatish va himoyalash uchun kerak.\n\n3. Ko'rishlar soni\nYangilik o'qilganda anonim hisoblagich oshiriladi. Shu qurilmadan bugun o'qilganini eslab qolish uchun brauzeringizda kichik belgi (localStorage) saqlanadi. U shaxsni aniqlash uchun ishlatilmaydi.\n\n4. Uchinchi tomon xizmatlari\nSaytda Google Fonts (shriftlar) ishlatiladi. YouTube, Vimeo, Facebook, Instagram, TikTok kabi xizmatlarning videolari ochilganda ular o'z cookie-fayllarini qo'yishi va ma'lumot yig'ishi mumkin. Bu xizmatlarning o'z maxfiylik qoidalari amal qiladi. Telegram orqali ulashganingizda Telegram qoidalari amal qiladi.\n\n5. Xodimlar uchun platforma\nXodimlar platformasi faqat maktab xodimlari uchun, Google hisobi orqali kiriladi va ochiq saytdan alohida ishlaydi. O'quvchilar va ota-onalar haqidagi shaxsiy ma'lumotlar ochiq saytda e'lon qilinmaydi.\n\n6. Cookie va reklama\nSayt reklama yoki kuzatuv maqsadidagi cookie-fayllarni o'zi ishlatmaydi.\n\n7. O'quvchilar tasvirlari\nBolalarning rasm va videolari faqat ota-onalarning (qonuniy vakillarning) roziligi bilan joylanadi. Olib tashlashni so'rash uchun «Aloqa» bo'limidagi manzillarga murojaat qiling.\n\n8. Sizning huquqlaringiz\nSiz o'zingiz haqingizdagi ma'lumotni so'rash, tuzatish yoki o'chirishni talab qilishingiz mumkin. Buning uchun «Aloqa» bo'limi orqali murojaat qiling.\n\n9. Qonunchilik\nMa'lumotlar bilan ishlashda O'zbekiston Respublikasining shaxsga doir ma'lumotlar to'g'risidagi qonunchiligi talablariga amal qilinadi.\n\n10. O'zgarishlar\nUshbu siyosat o'zgartirilishi mumkin. Yangi versiya shu sahifada e'lon qilinadi.";

  var SKEYS=['intro','address','phone','email','hours','telegram','instagram','youtube','mapUrl','terms','privacy'];
  function mergeInfo(o){ SKEYS.forEach(function(k){ var v=typeof o[k]==='string'?o[k].trim().slice(0,(k==='terms'||k==='privacy')?8000:400):''; SCHOOL[k]=(k==='intro')?(v||DEFAULT_INTRO):v }) }
  try{ var cached=JSON.parse(localStorage.getItem('m28_site')||'null'); if(cached) mergeInfo(cached) }catch(e){}
  function loadInfo(){
    try{
      if(!window.firebase||!firebase.firestore) return;
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      firebase.firestore().collection('publicinfo').doc('maktab').get().then(function(d){
        if(!d.exists) return; var o=d.data()||{}; mergeInfo(o);
        try{ localStorage.setItem('m28_site',JSON.stringify(o)) }catch(e){}
        route();
      }).catch(function(){});
    }catch(e){}
  }
  route();
  loadInfo();
})();
</script>
